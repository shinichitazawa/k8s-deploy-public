apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netobserv-ebpf-agent
  namespace: netobserv
  labels:
    app: netobserv-ebpf-agent
spec:
  selector:
    matchLabels:
      app: netobserv-ebpf-agent
  template:
    metadata:
      labels:
        app: netobserv-ebpf-agent
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: agent
          image: quay.io/netobserv/netobserv-ebpf-agent:main
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: EXPORT
              value: "direct-flp"
            - name: LOG_LEVEL
              value: "info"
            - name: FLP_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: flp-config
                  key: flp-config.json
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
