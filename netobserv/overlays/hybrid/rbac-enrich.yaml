# FLP の Kubernetes enrichment(add_kubernetes)用 RBAC。
# FLP は in-cluster SA で pods/services/nodes/replicasets を informer で読む。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netobserv-ebpf-agent
  namespace: netobserv
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netobserv-k8s-enrich
rules:
  - apiGroups: [""]
    resources: [pods, services, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, daemonsets, deployments, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netobserv-k8s-enrich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netobserv-k8s-enrich
subjects:
  - kind: ServiceAccount
    name: netobserv-ebpf-agent
    namespace: netobserv
