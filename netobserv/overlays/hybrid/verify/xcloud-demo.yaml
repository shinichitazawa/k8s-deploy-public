      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 50m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: xcloud-nginx-gcp, namespace: default}
spec:
  selector: {app: xcloud-nginx-gcp}
  ports: [{port: 80}]
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: xcloud-nginx-gcp-cron
  namespace: default
  annotations:
