# n8n single-main(regular mode)。UI/API/webhook/実行を 1 pod で担う。
# - DB は infra 共有 Zalando PostgreSQL(shared-db.infra.svc)。SSL 必須・self-signed。
# - パスワードは operator が n8n ns に払い出す Secret を参照。
# - N8N_ENCRYPTION_KEY は SealedSecret 由来の Secret を参照(不変・安定であること)。
# - 外部到達は overlays/rasp の Tailscale Ingress(HTTPS)。webhook/editor URL は
#   その tailnet FQDN に一致させる(でないと webhook が localhost で登録され壊れる)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  replicas: 1
  # 共有 DB へ接続する single-main。多重起動を避けるため Recreate。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      # keyless Bedrock: この SA が自前OIDCで AssumeRoleWithWebIdentity。
      # SA 本体(eks.amazonaws.com/role-arn 注釈)は ARN を git に載せないため
      # クラスタ側で管理(ArgoCD 非管理)。pod-identity-webhook が env を注入する。
      serviceAccountName: n8n-bedrock
      # CP(raspberrypi-0, arm64)に固定。cloud outpost は zero-scale/spot で揮発するため。
      nodeSelector:
        kubernetes.io/hostname: raspberrypi-0
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:2.33.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5678
          env:
            # --- DB: 共有 Zalando PostgreSQL(SSL 必須 / self-signed → verify 無効) ---
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: shared-db.infra.svc.cluster.local
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_SCHEMA
              value: public
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n.n8n.shared-db.credentials.postgresql.acid.zalan.do
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n.n8n.shared-db.credentials.postgresql.acid.zalan.do
                  key: password
            - name: DB_POSTGRESDB_SSL_ENABLED
              value: "true"
            - name: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
              value: "false"
            # --- Web / UI / Webhook: Tailscale HTTPS 外部 URL に一致させる ---
            - name: N8N_HOST
              value: n8n.example.ts.net
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_PORT
              value: "5678"
            - name: N8N_LISTEN_ADDRESS
              value: 0.0.0.0
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.example.ts.net/
            - name: N8N_WEBHOOK_URL
              value: https://n8n.example.ts.net/
            # Ingress(Tailscale)を 1 段挟むので X-Forwarded-* を信頼する。
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: GENERIC_TIMEZONE
              value: Asia/Tokyo
            - name: TZ
              value: Asia/Tokyo
            # 診断ノイズ抑制(任意)。
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            # keyless Bedrock: AWS Bedrock Chat Model の「Use system credentials」を許可。
            # pod-identity-webhook が注入する IRSA(web-identity)資格を base に awsAssumeRole が使う。
            - name: N8N_AWS_SYSTEM_CREDENTIALS_ACCESS_ENABLED
              value: "true"
            # --- 暗号鍵: SealedSecret 由来。base の sealedsecret.yaml 有効化後に注入される ---
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-encryption-key
                  key: N8N_ENCRYPTION_KEY
          volumeMounts:
            # SQLite 不使用(Postgres)。~/.n8n は config/一時のみで永続不要 → emptyDir。
            # 将来 filesystem binary mode を使うなら local-path PVC へ差し替え。
            - name: n8n-data
              mountPath: /home/node/.n8n
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: n8n-data
          emptyDir: {}
