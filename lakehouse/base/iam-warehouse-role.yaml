# Lakekeeper の warehouse が S3 を読み書きするための「被 assume ロール」。
#
# なぜ pod のロール(lakekeeper-s3-role)に直接 S3 権限を持たせないのか:
# Lakekeeper は client(Trino / pyiceberg など)に一時クレデンシャルを **vend** する。
# vend は「ロールを session policy 付きで AssumeRole し、絞った鍵を返す」実装なので、
# assume 先のロールが必ず要る(storage-profile の sts-role-arn。未指定なら assume-role-arn)。
# 公式もこの二段構えを推奨し、system identity 側には直接権限を付けないよう明記している。
#   https://docs.lakekeeper.io/docs/nightly/storage/
#
# external-id は「混乱した代理人」対策。Lakekeeper に warehouse を作れる者が、
# system identity が assume できる任意のロールへ横滑りするのを防ぐ。
# LAKEKEEPER__S3_REQUIRE_EXTERNAL_ID_FOR_SYSTEM_CREDENTIALS は既定 true なので必須。
# 値は秘密鍵ではなく突合用の識別子(AWS 側の信頼ポリシーにも平文で載る)。
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Policy
metadata:
  name: lakekeeper-warehouse-policy
  namespace: infra
spec:
  name: lakekeeper-warehouse-policy
  path: /ack/
  # Iceberg は multipart を使うので Abort/ListParts/ListBucketMultipartUploads が要る。
  # 対象は warehouse/ 配下のみ。Lakekeeper が管理する Iceberg テーブルの実体だけを許可する。
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        { "Sid": "BucketLevel",
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket",
            "s3:GetBucketLocation",
            "s3:ListBucketMultipartUploads"
          ],
          "Resource": "arn:aws:s3:::example-lakehouse-bucket" },
        { "Sid": "ObjectLevel",
          "Effect": "Allow",
          "Action": [
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:AbortMultipartUpload",
            "s3:ListMultipartUploadParts"
          ],
          "Resource": "arn:aws:s3:::example-lakehouse-bucket/warehouse/*" }
      ]
    }
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: lakekeeper-warehouse-role
  namespace: infra
spec:
  name: lakekeeper-warehouse-role
  path: /ack/
  # 信頼するのは pod のロール(IRSA)だけ。external-id が一致しない AssumeRole は通らない。
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        { "Effect": "Allow",
          "Principal": { "AWS": "arn:aws:iam::111111111111:role/ack/lakekeeper-s3-role" },
          "Action": "sts:AssumeRole",
          "Condition": { "StringEquals": {
            "sts:ExternalId": "6227c7b40c2b785e64eb6530e813f355"
          } } }
      ]
    }
  # ACK の Policy と Role を素で書いているので ARN は直書きになる(RGD のように
  # ${policy.status...arn} で解決できない)。path /ack/ 固定なので値は決定的。
  policies:
    - arn:aws:iam::111111111111:policy/ack/lakekeeper-warehouse-policy
