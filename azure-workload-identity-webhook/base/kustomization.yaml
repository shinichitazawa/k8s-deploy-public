apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Azure Workload Identity Mutating Webhook(azure-workload-identity v1.6.0)を vendoring。
# helm template で生成した静的マニフェスト(ArgoCD self-heal 配下で管理するため helm hook を避ける)。
# ns は upstream 既定の azure-workload-identity-system ではなく cluster-ops に寄せている
# (ops ツール集約 / AWS pod-identity-webhook と同居)。namespaceSelector={} なので全 ns の Pod を対象。
namespace: cluster-ops

resources:
  - workload-identity-webhook.yaml
