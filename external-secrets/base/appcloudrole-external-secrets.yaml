# ESO が AWS Secrets Manager を読むための IAM ロール(keyless)。
# RGD AppCloudRole(kro-rgds/base/rgd-app-cloud-role.yaml)が ACK で Policy + Role を合成する。
#
# 読めるのは example-env/rpi0-hybrid/ 配下だけ。このクラスタが使う秘密値をここに集約し、
# Terraform も同じ場所を data source で読む(ec2/k3s-cilium-lakehouse-node)。
apiVersion: kro.run/v1alpha1
kind: AppCloudRole
metadata:
  name: external-secrets
  namespace: infra
spec:
  name: external-secrets
  serviceAccountSub: system:serviceaccount:external-secrets:external-secrets
  policyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        { "Sid": "ReadClusterSecrets",
          "Effect": "Allow",
          "Action": [
            "secretsmanager:GetSecretValue",
            "secretsmanager:DescribeSecret"
          ],
          "Resource": "arn:aws:secretsmanager:ap-northeast-1:111111111111:secret:example-env/rpi0-hybrid/*" },
        { "Sid": "ListSecrets",
          "Effect": "Allow",
          "Action": "secretsmanager:ListSecrets",
          "Resource": "*" }
      ]
    }
