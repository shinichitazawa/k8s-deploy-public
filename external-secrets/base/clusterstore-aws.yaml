# ClusterSecretStore: AWS Secrets Manager(ap-northeast-1 / example-env)。
#
# **auth ブロックを書かない。** ESO は auth 未指定だとコントローラ自身の AWS 資格情報
# (= SA annotation で pod-identity-webhook が注入した web identity)を使う。
# このリポジトリの keyless 方針そのままで、静的キーも SecretStore 用の Secret も要らない。
#
# API は external-secrets.io/v1。chart 2.x では v1 が保存バージョンで、
# v1beta1 は crds.unsafeServeV1Beta1 を立てない限り提供されない。
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
