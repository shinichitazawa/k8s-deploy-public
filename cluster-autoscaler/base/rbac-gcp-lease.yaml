# マルチ CA(AWS/GCP/Azure)が同一 ns で共存するため leader-election lease 名を分離している
# (values-gcp.yaml の --leader-elect-resource-name=cluster-autoscaler-gcp)。
# chart 生成の Role は既定 lease 名しか許可しないため、分離した lease 名への権限を補足する。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ca-gcp-lease
  namespace: cluster-ops
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["cluster-autoscaler-gcp"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ca-gcp-lease
  namespace: cluster-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ca-gcp-lease
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler-gcp
    namespace: cluster-ops
