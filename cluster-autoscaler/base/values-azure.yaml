# Cluster Autoscaler — Azure(Phase2)。VMSS を Pending Pod で 0→N。issue #13。
# ★ 2026-07 live 検証(CA が VMSS を keyless/Workload Identity で管理・scale-from-0 テンプレート構築)。
#   AWS/GCP パターンを Azure 版に展開。
#
# 前提:
#   1. providerID: azure cloud-init の k3s agent に
#      `--kubelet-arg=provider-id=azure:///subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Compute/virtualMachineScaleSets/<vmss>/virtualMachines/<idx>`
#      を追加(azure/k3s-cilium-hybrid-node の user-data)。実ノード join 時の CA 相関に必須。
#   2. keyless 認証: **Azure Workload Identity Federation**(app 4c348c8c-… の federated credential
#      subject=system:serviceaccount:cluster-ops:cluster-autoscaler-azure, aud=api://AzureADTokenExchange,
#      issuer=自前 S3 OIDC)。app SP に VMSS スコープの Contributor ロールを付与済み。
#      token/env は **azure-workload-identity webhook が自動注入**(SA ラベル/アノテーション + Pod ラベル)。
#      → projected token / AZURE_* env の手動 wiring は不要(webhook が入れる)。webhook: [[azure-workload-identity-webhook]]
#   3. VMSS に node-template ラベル(cloud=azure)。
cloudProvider: azure

autoscalingGroups:
  - name: azure-cil-vmss
    minSize: 0
    maxSize: 2

# Azure provider の接続情報。chart は Secret(SubscriptionID/ResourceGroup/VMType)+ ARM_USE_WORKLOAD_IDENTITY_EXTENSION
# を注入する。clientID/tenantID は federated app(Secret の ClientSecret は WI 経路では未使用)。
azureUseWorkloadIdentityExtension: true
azureSubscriptionID: "f160a26b-c5fc-42e9-830a-6d71fd618c61"
azureTenantID: "340d88ff-7550-4d01-960a-dd3380efc15b"
azureClientID: "4c348c8c-cdfe-405d-909e-e8aaf6359fcf"
azureResourceGroup: "k3s-cilium-hybrid"
azureVMType: "vmss"

rbac:
  create: true
  serviceAccount:
    create: true
    name: cluster-autoscaler-azure
    # webhook が client-id を読み、projected token + AZURE_* env を自動注入する。
    labels:
      azure.workload.identity/use: "true"
    annotations:
      azure.workload.identity/client-id: "4c348c8c-cdfe-405d-909e-e8aaf6359fcf"

# webhook の objectSelector は **Pod ラベル** azure.workload.identity/use=true をトリガにする。
# SA ラベルだけでは注入されないため Pod template にも付ける(これが無いと token/env が入らない)。
podLabels:
  azure.workload.identity/use: "true"

# ※ token/env は webhook が注入するので手動 wiring(extraVolumes/extraEnv)は不要。

extraArgs:
  scale-down-enabled: true
  scale-down-unneeded-time: 5m
  expander: least-waste
  # マルチ CA(AWS/GCP/Azure)が同一 ns で共存するため lease 名を分離(既定 cluster-autoscaler だと競合)
  leader-elect-resource-name: cluster-autoscaler-azure

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
tolerations:
  - operator: Exists
resources:
  requests: { cpu: 20m, memory: 128Mi }
  limits: { memory: 256Mi }
