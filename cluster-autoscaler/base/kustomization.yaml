apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cluster-ops

# CA の補助リソース(分離 lease の RBAC、GCP は keyless/WIF の credential-config・gce.conf)
resources:
  - configmap-gcp.yaml
  - rbac-gcp-lease.yaml
  - rbac-azure-lease.yaml

# CA は 1 プロバイダ=1 デプロイ。クラウド別に helmChart を並べる。
# AWS / GCP / Azure すべて live 検証済み。
helmCharts:
  - name: cluster-autoscaler
    repo: https://kubernetes.github.io/autoscaler
    version: 9.59.0            # appVersion 1.35.0
    releaseName: cluster-autoscaler-aws
    namespace: cluster-ops
    valuesFile: values-aws.yaml

  - name: cluster-autoscaler
    repo: https://kubernetes.github.io/autoscaler
    version: 9.59.0
    releaseName: cluster-autoscaler-gcp
    namespace: cluster-ops
    valuesFile: values-gcp.yaml

  - name: cluster-autoscaler
    repo: https://kubernetes.github.io/autoscaler
    version: 9.59.0
    releaseName: cluster-autoscaler-azure
    namespace: cluster-ops
    valuesFile: values-azure.yaml
