# ResourceGraphDefinition: app-cloud-access
#
# 目的: アプリが必要とする「S3 バケット + それに対する最小権限の IAM ロール(keyless assume)」を、
#   高レベル CR 1枚(`kind: AppCloudAccess`)で宣言する。中で ACK の Bucket/Policy/Role を合成。
#   → 手作業 IAM や Terraform 分散をやめ、アプリと権限を同じ GitOps 宣言で一元管理。
#
# 前提: ACK s3/iam controller 導入済み(`ack/README.md`)+ self-hosted IRSA 基盤
#   (`docs/hybrid-oidc-irsa-ack.md`)。ACK CRD が存在すること。
#
# ★ scoped 権限の制約(ACK controller のロールに合わせる):
#   - bucketName は必ず `example-ack-*` prefix(s3-controller が許可する resource 境界)
#   - Role/Policy は path `/ack/`(iam-controller が許可する path 境界)
#   本 RGD はこの制約を満たすよう path を固定している。
#
# クラスタ定数(この rpi0 hybrid 固有): OIDC provider / issuer host は下記 default。
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: app-cloud-access
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  schema:
    apiVersion: v1alpha1
    kind: AppCloudAccess
    spec:
      name: string                              # アプリ識別子(リソース名 prefix)
      bucketName: string                        # ★ 要 `example-ack-*` prefix + グローバル一意
      serviceAccountSub: string                 # 例 system:serviceaccount:<ns>:<sa>(assume 許可対象)
      oidcProviderArn: string | default="arn:aws:iam::111111111111:oidc-provider/example-oidc-bucket.s3.ap-northeast-1.amazonaws.com"
    status:
      bucketArn: ${bucket.status.ackResourceMetadata.arn}
      roleArn: ${role.status.ackResourceMetadata.arn}
  resources:
    # 1) S3 バケット
    - id: bucket
      template:
        apiVersion: s3.services.k8s.aws/v1alpha1
        kind: Bucket
        metadata:
          name: ${schema.spec.name}-bucket
          namespace: infra
        spec:
          name: ${schema.spec.bucketName}

    # 2) バケット限定のポリシー(readwrite)。path /ack/(iam-controller 権限境界)
    - id: policy
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Policy
        metadata:
          name: ${schema.spec.name}-s3-policy
          namespace: infra
        spec:
          name: ${schema.spec.name}-s3-policy
          path: /ack/
          policyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                { "Effect": "Allow",
                  "Action": ["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket"],
                  "Resource": ["arn:aws:s3:::${schema.spec.bucketName}","arn:aws:s3:::${schema.spec.bucketName}/*"] }
              ]
            }

    # 3) アプリが keyless で assume する IAM ロール。Federated(OIDC)+ aud/sub 条件。path /ack/
    - id: role
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: ${schema.spec.name}-role
          namespace: infra
        spec:
          name: ${schema.spec.name}-role
          path: /ack/
          # 条件キーの host 部分はクラスタ定数(issuer host)をリテラル埋め込み。値のみ ${} 補間。
          assumeRolePolicyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                { "Effect": "Allow",
                  "Principal": { "Federated": "${schema.spec.oidcProviderArn}" },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": { "StringEquals": {
                    "example-oidc-bucket.s3.ap-northeast-1.amazonaws.com:aud": "sts.amazonaws.com",
                    "example-oidc-bucket.s3.ap-northeast-1.amazonaws.com:sub": "${schema.spec.serviceAccountSub}"
                  } } }
              ]
            }
          policies:
            - ${policy.status.ackResourceMetadata.arn}
