apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: flow-ingest

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ciliumnetworkpolicy.yaml
  - cronjob-compact.yaml

# 内容が変わると名前のハッシュが変わり、Deployment が作り直される。
configMapGenerator:
  - name: flow-ingest-config
    files:
      - ingest.py
      - genericmap_pb2.py
      - prepare.sh
      - requirements.lock
  - name: flow-compact-script
    files:
      - compact.sh
