# Iceberg の小さいファイルをまとめる。受け口が 60 秒ごとに append するので、放っておくと
# 1 日 1,440 ファイルになる。Trino の ALTER TABLE ... EXECUTE を REST API 経由で叩く。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flow-compact
  labels:
    app.kubernetes.io/name: flow-compact
spec:
  schedule: "20 * * * *"
  # 前回が終わっていなければ飛ばす(同じ表を 2 つの optimize が触らないように)。
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: flow-compact
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: compact
              # ghost-node-reaper と同じ image(curl / jq / bash が入っている)。multi-arch。
              image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
              command: ["/bin/bash", "/scripts/compact.sh"]
              env:
                - {name: TRINO_URL, value: "http://trino.trino.svc.cluster.local:8080"}
                - {name: TRINO_CATALOG, value: lakehouse}
                - {name: TRINO_SCHEMA, value: bronze}
                - {name: TRINO_USER, value: flow-compact}
                # 空白区切りで複数指定できる。
                - {name: TABLES, value: netobserv_flows}
                # スナップショットと孤立ファイルの保持期間。Trino の既定の下限が 7 日で、
                # それより短くするには catalog 側の設定変更が要る。
                - {name: SNAPSHOT_RETENTION, value: 7d}
                - {name: ORPHAN_RETENTION, value: 7d}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 192Mi}
          volumes:
            - name: script
              configMap:
                name: flow-compact-script
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flow-compact
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flow-compact
  # 受け口を持たない(誰からも接続されない)。
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: trino
            app.kubernetes.io/name: trino
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
