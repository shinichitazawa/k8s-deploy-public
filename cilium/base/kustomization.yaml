apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace: は指定しない (cilium chart が複数 namespace を生成するため衝突を回避)

resources:
  - namespace.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    version: 1.17.0
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml
