# Idempotent Job: ensure the kagent virtual key exists in LiteLLM's DB.
#
# When LiteLLM starts with a fresh PostgreSQL DB (or after schema reset),
# the virtual key `sk-litellm-internal-noauth` (used by kagent ModelConfig
# claude-sonnet-4) gets dropped, and every kagent → LiteLLM call fails 401.
#
# This Job runs after each ArgoCD sync. It POSTs /key/generate with the
# specific desired key. LiteLLM returns 200 if newly created, or 200 with
# the existing key if already present (idempotent — confirmed via probe).
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-key-bootstrap
  namespace: ai-platform
  annotations:
    # Re-run every sync; key creation is idempotent.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-key-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: curlimages/curl:8.10.1
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-auth
                  key: LITELLM_MASTER_KEY
          command:
            - sh
            - -c
            - |
              set -eu
              URL=http://litellm-proxy.ai-platform.svc.cluster.local:4000
              KEY=sk-litellm-internal-noauth
              echo "Checking if $KEY exists..."
              code=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
                "$URL/key/info?key=$KEY")
              if [ "$code" = "200" ]; then
                echo "Key already exists (idempotent OK)"
                exit 0
              fi
              echo "Key missing (HTTP $code), generating..."
              curl -sS -X POST \
                -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
                -H "Content-Type: application/json" \
                -d '{
                  "key": "'"$KEY"'",
                  "models": ["claude-sonnet-4","claude-3-5-sonnet","claude-3-7-sonnet","claude-haiku"],
                  "max_budget": 1000,
                  "key_alias": "kagent-internal"
                }' \
                "$URL/key/generate"
              echo ""
              echo "Generated."
